name: Spanish A2 integrated course checks
on:
  pull_request:
    branches:
      - feature/scalable-progress-foundation
    paths:
      - 'lib/features/learn/data/academy_spanish_a2_course.dart'
      - 'lib/features/learn/presentation/academy_spanish_a1_screen.dart'
      - 'lib/features/learn/presentation/academy_course_screen.dart'
      - 'test/academy_spanish_a2_full_course_test.dart'
      - '.github/workflows/academy-spanish-a2.yml'
jobs:
  verify_spanish_a2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Spanish A1 and A2 integration
        run: |
          flutter analyze --no-pub lib/features/learn/data/academy_spanish_a1_course.dart lib/features/learn/data/academy_spanish_a2_course.dart lib/features/learn/presentation/academy_spanish_a1_screen.dart lib/features/learn/presentation/academy_course_screen.dart test/academy_spanish_a1_full_course_test.dart test/academy_spanish_a2_full_course_test.dart
      - name: Run regression and complete A2 curriculum tests
        run: flutter test --no-pub test/academy_spanish_a1_full_course_test.dart test/academy_spanish_a2_full_course_test.dart
