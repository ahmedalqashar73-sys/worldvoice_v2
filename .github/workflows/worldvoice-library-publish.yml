name: Publish approved WorldVoice Library PDFs

# Attach one WorldVoice_Library_Approved_*.zip to a GitHub Release with
# a worldvoice-library-* tag, then publish the Release. This runs on main only.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing worldvoice-library-* Release tag containing an approved ZIP asset'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: worldvoice-library-publisher-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name, 'worldvoice-library-')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout original main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Verify release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            worldvoice-library-*) ;;
            *) echo "ERROR: tag must start with worldvoice-library-" >&2; exit 1 ;;
          esac
          printf 'WORLDVOICE_RELEASE_TAG=%s\n' "$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Download exactly one approved bundle from Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/worldvoice-approved"
          gh release download "$WORLDVOICE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'WorldVoice_Library_Approved_*.zip' \
            --dir "$RUNNER_TEMP/worldvoice-approved"
          shopt -s nullglob
          bundles=("$RUNNER_TEMP"/worldvoice-approved/WorldVoice_Library_Approved_*.zip)
          if [ "${#bundles[@]}" -ne 1 ]; then
            echo "ERROR: attach exactly one WorldVoice_Library_Approved_*.zip" >&2
            exit 1
          fi
          printf 'WORLDVOICE_BUNDLE=%s\n' "${bundles[0]}" >> "$GITHUB_ENV"

      - name: Validate every PDF and its SHA-256 before publishing
        run: python3 tools/publish_worldvoice_library.py --archive "$WORLDVOICE_BUNDLE"

      - name: Configure authorized GitHub Actions committer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish sequentially to main and verify every remote blob
        run: python3 tools/publish_worldvoice_library.py --archive "$WORLDVOICE_BUNDLE" --publish

      - name: Verify clean working tree and remote main
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "WorldVoice Library approved PDFs verified on main"
