name: Export tested WorldVoice source ZIP
on:
  push:
    branches:
      - feature/scalable-progress-foundation
    paths:
      - .github/workflows/export-tested-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision of validated debug APK
        uses: actions/checkout@v4
        with:
          ref: a877035c4a239ec7e4d3dbae9b397e13d2590fb5
          fetch-depth: 1
      - name: Package all tracked source files as one ZIP
        shell: bash
        run: |
          git archive --format=zip --output=WorldVoice_Source_a877035.zip HEAD
          unzip -t WorldVoice_Source_a877035.zip | tail -1
          sha256sum WorldVoice_Source_a877035.zip > WorldVoice_Source_a877035.sha256
      - name: Upload immutable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: WorldVoice-source-a877035
          path: |
            WorldVoice_Source_a877035.zip
            WorldVoice_Source_a877035.sha256
          retention-days: 14
          if-no-files-found: error
