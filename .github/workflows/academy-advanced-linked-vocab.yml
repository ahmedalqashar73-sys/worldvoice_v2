name: Academy A2-C2 linked vocabulary checks
on:
  pull_request:
    branches: [feature/scalable-progress-foundation]
    paths:
      - 'lib/features/learn/data/academy_english_advanced_learning_path.dart'
      - 'lib/features/learn/presentation/academy_english_advanced_screen.dart'
      - 'test/academy_linked_forty_words_test.dart'
      - '.github/workflows/academy-advanced-linked-vocab.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Academy code
        run: flutter analyze --no-pub lib/features/learn/data/academy_english_advanced_learning_path.dart lib/features/learn/presentation/academy_english_advanced_screen.dart test/academy_linked_forty_words_test.dart
      - name: Test curriculum word banks
        run: flutter test --no-pub test/academy_linked_forty_words_test.dart test/academy_english_advanced_story_tests.dart
