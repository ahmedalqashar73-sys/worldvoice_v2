name: Temporary Academy A1 Flow Parity Validation
on:
  push:
    branches:
      - fix/academy-advanced-exact-a1-eight-section-order-20261020
jobs:
  academy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_english_advanced_story_tests.dart test/academy_english_a1_full_path_test.dart
