name: Temporary Academy Lesson Navigation Validation
on:
  push:
    branches:
      - fix/academy-lesson-numbers-section-menu-20261019
jobs:
  validate-academy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_english_a1_full_path_test.dart test/academy_a1_dialogues_test.dart test/academy_catalog_test.dart test/academy_guided_flow_widget_test.dart test/academy_placement_test.dart
