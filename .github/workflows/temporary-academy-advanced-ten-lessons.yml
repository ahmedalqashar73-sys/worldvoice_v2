name: Temporary Advanced English Ten Lesson Validation
on:
  push:
    branches:
      - feat/academy-english-advanced-second-lessons-20261019
jobs:
  academy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_english_advanced_story_tests.dart test/academy_english_a1_full_path_test.dart test/academy_a1_tutor_first_three_test.dart test/academy_tutor_localizations_test.dart test/academy_journey_story_test.dart
