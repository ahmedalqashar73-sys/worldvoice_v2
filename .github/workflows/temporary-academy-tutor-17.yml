name: Temporary Academy Tutor Localization Check
on:
  push:
    branches:
      - feat/academy-tutor-localization-17-20261019
jobs:
  flutter-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_tutor_localizations_test.dart test/academy_a1_tutor_first_three_test.dart test/academy_english_a1_full_path_test.dart test/academy_a1_dialogues_test.dart test/academy_guided_flow_widget_test.dart test/academy_placement_test.dart
