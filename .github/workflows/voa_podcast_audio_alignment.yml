name: Propose VOA Podcast Cue Alignment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/podcasts/en/A1/en-a1-voa-020.json'
      - 'scripts/voa_lesson20_align_candidate.py'
      - '.github/workflows/voa_podcast_audio_alignment.yml'

permissions:
  contents: read

jobs:
  propose-voa-cues:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare speech alignment dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --no-cache-dir whisper-timestamped==1.15.9
      - name: Match transcript to authentic VOA MP3 word timestamps
        run: |
          python scripts/voa_lesson20_align_candidate.py \
            --model base.en \
            --output /tmp/voa_lesson20_cues_proposed.json
      - name: Save REVIEW-ONLY cue proposal
        uses: actions/upload-artifact@v4
        with:
          name: voa-lesson20-cues-review-required
          path: /tmp/voa_lesson20_cues_proposed.json
          if-no-files-found: error
          retention-days: 14
