name: Temporary Tutor Localization Academy Check
on:
  push:
    branches:
      - feat/academy-tutor-locales-multilang-pilot-20261019
jobs:
  flutter-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_tutor_locales_test.dart test/academy_a1_tutor_first_three_test.dart test/academy_english_a1_full_path_test.dart test/academy_catalog_test.dart test/academy_placement_test.dart
