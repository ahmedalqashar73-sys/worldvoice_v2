name: Temporary Academy Dialogue Verification
on:
  push:
    branches: [feat/academy-a1-dialogues-listening-20261019]
jobs:
  academy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_a1_dialogues_test.dart test/academy_english_a1_full_path_test.dart test/academy_catalog_test.dart test/academy_placement_test.dart
