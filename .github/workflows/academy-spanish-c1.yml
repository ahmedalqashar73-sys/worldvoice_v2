name: Spanish C1 integrated Academy checks
on:
  pull_request:
    branches: [feature/scalable-progress-foundation]
    paths:
      - 'lib/features/learn/data/academy_spanish_c1_course.dart'
      - 'lib/features/learn/presentation/academy_spanish_a1_screen.dart'
      - 'lib/features/learn/presentation/academy_course_screen.dart'
      - 'test/academy_spanish_c1_full_course_test.dart'
      - '.github/workflows/academy-spanish-c1.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze C1 and shared Spanish academy UI
        run: flutter analyze --no-pub lib/features/learn/data/academy_spanish_c1_course.dart lib/features/learn/presentation/academy_spanish_a1_screen.dart lib/features/learn/presentation/academy_course_screen.dart test/academy_spanish_c1_full_course_test.dart
      - name: Test Spanish A1 through C1
        run: flutter test --no-pub test/academy_spanish_a1_full_course_test.dart test/academy_spanish_a2_full_course_test.dart test/academy_spanish_b1_full_course_test.dart test/academy_spanish_b2_full_course_test.dart test/academy_spanish_c1_full_course_test.dart
