name: Academy A1 Integrated Lesson Verification

on:
  push:
    branches:
      - fix/academy-a1-complete-lessons-nine-stories-20261019

jobs:
  academy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_english_a1_complete_lessons_test.dart test/academy_english_a1_full_path_test.dart test/academy_catalog_test.dart test/academy_journey_story_test.dart test/academy_guided_flow_widget_test.dart test/academy_placement_test.dart test/academy_pronunciation_widget_test.dart
