name: Agora Worker Unit Tests
on:
  workflow_dispatch:
  pull_request:
    branches:
      - feat/economy-chat-context-20260928
  push:
    branches:
      - fix/free-worker-always-available-agora-20260927
      - fix/green-room-chat-stage-hand-preview-20260927
      - fix/firestore-captions-permission-20260927
      - feat/economy-foundation-20260928
      - feat/economy-wallet-ui-20260928
      - feat/economy-chat-context-20260928
      - fix/finish-room-hub-quiz-gift-20260928
jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/room_conversation_panel_test.dart test/room_quiz_options_test.dart

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agora-token-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

  firestore-captions-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
        working-directory: test/firestore
      - name: Run isolated Firestore security rule regression tests
        working-directory: test/firestore
        run: npx firebase emulators:exec --config ../../firebase.rules-test.json --only firestore --project demo-worldvoice-rules "npm test"

  backend-economy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check src/server.js
      - run: node --check src/room_task_policy.js
      - run: node --check src/wallet_store.js
      - run: node --check src/wallet_routes.js
      - run: node --check src/payment_reversals.js
      - run: node --check src/profile_projection.js
      - run: node --check scripts/stage-private-wallet.mjs
      - run: npm test


  deploy-worker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/finish-room-hub-quiz-gift-20260928'
    needs: [test, backend-economy, firestore-captions-rules, flutter-analyze]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agora-token-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORLDVOICE_FULL_BACKEND_URL: ${{ secrets.WORLDVOICE_FULL_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Deploy Worker gateway when Cloudflare credentials exist
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID not configured."
            exit 0
          fi
          npx wrangler deploy
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Connect full backend gateway
        if: steps.deploy.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WORLDVOICE_FULL_BACKEND_URL:-}" ]; then
            echo "AUX_BACKEND_URL unchanged: WORLDVOICE_FULL_BACKEND_URL is not configured."
            exit 0
          fi
          printf '%s' "$WORLDVOICE_FULL_BACKEND_URL" | npx wrangler secret put AUX_BACKEND_URL
