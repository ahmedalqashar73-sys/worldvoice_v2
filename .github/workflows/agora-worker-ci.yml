name: Agora Worker Unit Tests
on:
  workflow_dispatch:
  push:
    branches:
      - fix/free-worker-always-available-agora-20260927
      - fix/green-room-chat-stage-hand-preview-20260927
      - fix/firestore-captions-permission-20260927
jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/room_conversation_panel_test.dart

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agora-token-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

  firestore-captions-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
        working-directory: test/firestore
      - name: Run isolated Firestore security rule regression tests
        working-directory: test/firestore
        run: npx firebase emulators:exec --config ../../firebase.rules-test.json --only firestore --project demo-worldvoice-rules "npm test"
