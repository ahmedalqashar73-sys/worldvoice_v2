name: Agora Worker Unit Tests
on:
  workflow_dispatch:
  push:
    branches:
      - fix/free-worker-always-available-agora-20260927
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agora-token-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist
