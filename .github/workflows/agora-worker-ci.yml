name: Agora Worker Unit Tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/agora-token-worker/**'
      - '.github/workflows/agora-worker-ci.yml'
  push:
    branches: [main]
    paths:
      - 'services/agora-token-worker/**'
      - '.github/workflows/agora-worker-ci.yml'
jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/live_camera_controls_test.dart test/room_conversation_panel_test.dart test/room_quiz_options_test.dart

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agora-token-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

  firestore-captions-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
        working-directory: test/firestore
      - name: Run isolated Firestore security rule regression tests
        working-directory: test/firestore
        run: npx firebase emulators:exec --config ../../firebase.rules-test.json --only firestore --project demo-worldvoice-rules "npm test"

  backend-economy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: node --check src/server.js
      - run: node --check src/room_task_policy.js
      - run: node --check src/wallet_store.js
      - run: node --check src/wallet_routes.js
      - run: node --check src/payment_reversals.js
      - run: node --check src/profile_projection.js
      - run: node --check scripts/stage-private-wallet.mjs
      - run: npm test


  deploy-worker:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # Worker deployment depends on Worker tests and verified Firestore access.
    # Existing unrelated Flutter/Backend regressions are still reported by
    # their jobs, but must not block a tested token-service security fix.
    needs: [test, firestore-captions-rules]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agora-token-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORLDVOICE_FULL_BACKEND_URL: ${{ secrets.WORLDVOICE_FULL_BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - name: Deploy Worker gateway when Cloudflare credentials exist
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Cloudflare deployment is not configured. Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets, then run the workflow again."
            exit 1
          fi
          npx wrangler deploy
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Verify production Agora Worker is running this revision
        if: steps.deploy.outputs.configured == 'true'
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const url = 'https://worldvoice-agora-token.worldvoice.workers.dev/health';
          const expected = '2026-10-31.3';
          let last = '';
          for (let attempt = 1; attempt <= 3; attempt++) {
            try {
              const res = await fetch(url, {
                signal: AbortSignal.timeout(15000),
                headers: {'Cache-Control': 'no-cache'},
              });
              const body = await res.json();
              console.log(JSON.stringify({
                attempt, status: res.status, ok: body.ok,
                tokenApiRevision: body.tokenApiRevision,
                liveHostBootstrapSupported: body.liveHostBootstrapSupported,
              }));
              if (res.ok && body.ok === true &&
                  body.tokenApiRevision === expected &&
                  body.liveHostBootstrapSupported === true) {
                process.exit(0);
              }
              last = 'Worker returned an unhealthy or older revision';
            } catch (error) {
              last = error?.message ?? String(error);
            }
            await new Promise((resolve) => setTimeout(resolve, 2500));
          }
          console.error('Agora Worker deploy verification failed:', last);
          process.exit(1);
          JS
      - name: Connect full backend gateway
        if: steps.deploy.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WORLDVOICE_FULL_BACKEND_URL:-}" ]; then
            echo "AUX_BACKEND_URL unchanged: WORLDVOICE_FULL_BACKEND_URL is not configured."
            exit 0
          fi
          printf '%s' "$WORLDVOICE_FULL_BACKEND_URL" | npx wrangler secret put AUX_BACKEND_URL
