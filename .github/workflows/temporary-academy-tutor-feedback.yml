name: Temporary Tutor Example Feedback Validation
on:
  push:
    branches:
      - fix/academy-tutor-targeted-example-feedback-20261020
jobs:
  academy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_tutor_feedback_test.dart test/academy_a1_tutor_first_three_test.dart test/academy_grammar_workshops_test.dart
