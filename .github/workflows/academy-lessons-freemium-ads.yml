name: Academy freemium lesson ads
on:
  pull_request:
    branches:
      - feature/scalable-progress-foundation
    paths:
      - 'lib/core/ads/academy_lesson_ads.dart'
      - 'lib/features/learn/presentation/academy_spanish_a1_screen.dart'
      - 'lib/features/learn/presentation/academy_english_a1_screen.dart'
      - 'lib/features/learn/presentation/academy_english_advanced_screen.dart'
      - 'lib/features/learn/presentation/academy_course_screen.dart'
      - 'test/academy_lesson_ads_test.dart'
      - '.github/workflows/academy-lessons-freemium-ads.yml'
jobs:
  verify_cadence_and_lessons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter packages
        run: flutter pub get
      - name: Analyze integration and ad controller
        run: flutter analyze --no-pub lib/core/ads/academy_lesson_ads.dart lib/features/learn/presentation/academy_spanish_a1_screen.dart lib/features/learn/presentation/academy_english_a1_screen.dart lib/features/learn/presentation/academy_english_advanced_screen.dart lib/features/learn/presentation/academy_course_screen.dart test/academy_lesson_ads_test.dart
      - name: Verify ad frequency and Spanish learning regressions
        run: flutter test --no-pub test/academy_lesson_ads_test.dart test/academy_spanish_english_parity_test.dart test/academy_spanish_resume_audio_test.dart
