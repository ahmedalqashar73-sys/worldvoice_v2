name: Build WorldVoice Test APK (manual upload)

on:
  workflow_dispatch:

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Validate latest WorldVoice chat, cosmetics, and WorldBond before packaging
        run: |
          flutter analyze
          flutter test test/world_bond_api_url_test.dart test/chat_gift_message_card_test.dart test/worldvoice_avatar_frame_test.dart test/chat_delivery_crypto_test.dart
      - name: Refuse to build an APK without the eight premium images
        run: python3 scripts/verify_room_background_assets.py

      - name: Give Gradle more memory in CI
        shell: bash
        run: sed -i 's/-Xmx2048m/-Xmx4096m/' android/gradle.properties

      - name: Build Android TEST APK (versionCode increases per CI release)
        shell: bash
        run: |
          BUILD_NUMBER=$((20000 + GITHUB_RUN_NUMBER))
          flutter build apk --release --build-name=1.0.1 --build-number="$BUILD_NUMBER" \
            --dart-define=WORLDVOICE_BUILD_REVISION=${GITHUB_SHA} \
            --dart-define=WORLDVOICE_FRIEND_GIFT_PREVIEW=true \
            --dart-define=WORLDVOICE_OWNER_BETA_GIFTS_ENABLED=true \
            --dart-define=WORLDVOICE_GIFT_STORE_ENDPOINT=https://worldvoice-teacher-ai.onrender.com \
            --dart-define=WORLDVOICE_SOCIAL_BACKEND_URL=https://worldvoice-teacher-ai.onrender.com \
            --dart-define=WORLDVOICE_AI_BACKEND_URL=https://worldvoice-teacher-ai.onrender.com \
            --dart-define=AGORA_APP_ID=fa41476c6813471eb45c059bcb4a0e19 \
            --dart-define=WORLDVOICE_ROOM_BACKEND_URL=https://worldvoice-v2.onrender.com \
            --dart-define=AGORA_TOKEN_ENDPOINT=https://worldvoice-agora-token.worldvoice.workers.dev/agora/token \
            --dart-define=WORLDVOICE_ECONOMY_ENDPOINT=https://worldvoice-v2.onrender.com \
            --dart-define=WORLDVOICE_WORLDBOND_BACKEND_URL=https://worldvoice-teacher-ai.onrender.com

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: worldvoice-test-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7

