name: WorldVoice Chat Appearance Check

on:
  push:
    branches:
      - feature/scalable-progress-foundation
    paths:
      - '.github/workflows/chat-appearance-check.yml'
      - 'assets/chat_wallpapers/**'
      - 'assets/chat_bubbles/**'
      - 'assets/frames/**'
      - 'lib/features/profile/presentation/member_badges.dart'
      - 'backend/src/member_badge*'
      - 'test/member_badges_test.dart'
      - 'lib/core/widgets/worldvoice_avatar_frame.dart'
      - 'test/worldvoice_avatar_frame_test.dart'
      - 'lib/features/rooms/data/chat_bubble_catalog.dart'
      - 'lib/features/rooms/presentation/chat_bubble_frame.dart'
      - 'lib/features/rooms/presentation/chat_bubble_shop_sheet.dart'
      - 'lib/features/rooms/presentation/room_background_shop_sheet.dart'
      - 'lib/features/rooms/services/room_shop_service.dart'
      - 'lib/features/rooms/services/active_chat_bubble_service.dart'
      - 'lib/features/rooms/services/room_chat_service.dart'
      - 'lib/features/rooms/data/room_chat_message.dart'
      - 'lib/features/live/services/live_session_service.dart'
      - 'lib/features/live/presentation/live_screen.dart'
      - 'backend/src/chat_bubble_policy.js'
      - 'backend/src/server.js'
      - 'backend/test/chat_bubble_policy.test.js'
      - 'test/worldvoice_chat_bubble_catalog_test.dart'
      - 'test/worldvoice_active_chat_bubble_test.dart'
      - 'test/worldvoice_chat_bubble_art_test.dart'
      - 'firestore.rules'
      - 'lib/core/theme/worldvoice_appearance.dart'
      - 'lib/features/chat/presentation/worldvoice_chat_wallpaper.dart'
      - 'lib/features/chat/presentation/direct_chat_conversation_screen.dart'
      - 'lib/features/chat/presentation/worldvoice_shared_content_card.dart'
      - 'lib/features/chat/presentation/worldvoice_share_to_chat_sheet.dart'
      - 'lib/features/chat/services/chat_local_share_service.dart'
      - 'lib/features/chat/services/direct_chat_transport.dart'
      - 'lib/features/chat/presentation/chat_screen.dart'
      - 'lib/features/rooms/presentation/agora_voice_room_screen.dart'
      - 'lib/features/rooms/presentation/room_conversation_panel.dart'
      - 'lib/features/rooms/presentation/room_captions_sheet.dart'
      - 'lib/features/profile/presentation/user_profile_screen.dart'
      - 'lib/features/stories/presentation/story_viewer_screen.dart'
      - 'test/worldvoice_chat_shared_links_test.dart'
      - 'test/worldvoice_room_full_message_translation_test.dart'
      - 'lib/features/profile/presentation/settings_screen.dart'
      - 'lib/app/app.dart'
      - 'pubspec.yaml'
      - 'test/worldvoice_chat_appearance_test.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chat-appearance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Validate all six SVG assets
        run: |
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          paths = sorted(pathlib.Path("assets/chat_wallpapers").glob("*.svg"))
          assert len(paths) == 6, f"Expected six backgrounds; found {len(paths)}"
          for path in paths:
              root = ET.parse(path).getroot()
              assert root.tag.endswith("svg"), str(path)
              assert int(root.attrib.get("width", 0)) >= 720
              print("OK:", path)
          bubble_files = sorted(pathlib.Path("assets/chat_bubbles").glob("*.svg"))
          assert len(bubble_files) == 15, f"Expected 15 bubbles; found {len(bubble_files)}"
          for path in bubble_files:
              root = ET.parse(path).getroot()
              assert root.tag.endswith("svg"), str(path)
              assert root.attrib.get("viewBox") == "0 0 720 260", str(path)
              print("OK bubble:", path)
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/worldvoice_chat_appearance_test.dart test/worldvoice_chat_shared_links_test.dart test/worldvoice_room_full_message_translation_test.dart test/worldvoice_chat_bubble_catalog_test.dart test/worldvoice_active_chat_bubble_test.dart test/worldvoice_chat_bubble_art_test.dart test/worldvoice_avatar_frame_test.dart test/member_badges_test.dart test/vip_membership_store_test.dart
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify server-owned bubble prices and expiry
        working-directory: backend
        run: node --test test/chat_bubble_policy.test.js test/member_badge_policy.test.js
      - name: Install backend test dependencies
        working-directory: backend
        run: npm install --ignore-scripts --no-package-lock
      - name: Verify badge purchases and authorization
        working-directory: backend
        run: node --test test/member_badge_routes.test.js
