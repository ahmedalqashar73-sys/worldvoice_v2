name: Temporary Academy Journey Verification

on:
  push:
    branches: [feat/academy-guided-journey-storybooks-20261018]

jobs:
  academy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_catalog_test.dart test/academy_pronunciation_widget_test.dart test/academy_journey_story_test.dart test/academy_guided_flow_widget_test.dart
