name: Temporary Academy B1 Lessons 4-6 Verification
on:
  push:
    branches:
      - feat/academy-b1-unit1-lessons-4-6-20261020
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_english_advanced_story_tests.dart test/academy_english_a1_full_path_test.dart test/academy_a1_tutor_first_three_test.dart
