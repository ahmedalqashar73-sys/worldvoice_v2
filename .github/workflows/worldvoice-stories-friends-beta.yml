name: WorldVoice Stories Friends Beta APK

on:
  push:
    branches:
      - feature/scalable-progress-foundation
    paths:
      - ".github/workflows/worldvoice-stories-friends-beta.yml"
      - "lib/features/stories/**"
      - "backend/src/story_routes.js"
      - "pubspec.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stories-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Configure Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze full Android app
        run: flutter analyze
      - name: Run Flutter tests
        run: flutter test
      - name: Verify HD gifts, backgrounds, and castles
        run: |
          python3 scripts/verify_room_background_assets.py
          python3 scripts/verify_castle_assets.py --require-webp
      - name: Validate Stories backend JavaScript
        run: node --check backend/src/story_routes.js
      - name: Increase Gradle memory in CI only
        run: sed -i 's/-Xmx2048m/-Xmx4096m/' android/gradle.properties
      - name: Build installable Android friends-test APK
        run: >
          flutter build apk --release
          --build-number=${{ github.run_number }}
          --dart-define=WORLDVOICE_FRIEND_GIFT_PREVIEW=true
          --dart-define=AGORA_APP_ID=fa41476c6813471eb45c059bcb4a0e19
          --dart-define=WORLDVOICE_ROOM_BACKEND_URL=https://worldvoice-v2.onrender.com
          --dart-define=WORLDVOICE_SOCIAL_BACKEND_URL=https://worldvoice-v2.onrender.com
          --dart-define=WORLDVOICE_ECONOMY_ENDPOINT=https://worldvoice-v2.onrender.com
          --dart-define=AGORA_TOKEN_ENDPOINT=https://worldvoice-agora-token.worldvoice.workers.dev/agora/token
          --dart-define=WORLDVOICE_STORY_BACKEND_URL=https://worldvoice-teacher-ai.onrender.com
      - name: Upload friends-test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WorldVoice-Stories-Friends-Beta-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

      - name: Share with Firebase App Distribution testers when configured
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_TESTERS: ${{ secrets.FIREBASE_TESTERS }}
          FIREBASE_TESTER_GROUPS: ${{ secrets.FIREBASE_TESTER_GROUPS }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" && -z "${FIREBASE_TOKEN:-}" ]]; then
            echo "Firebase distribution skipped: no Firebase credentials configured."
            exit 0
          fi
          if [[ -z "${FIREBASE_TESTERS:-}" && -z "${FIREBASE_TESTER_GROUPS:-}" ]]; then
            echo "Firebase distribution skipped: no testers configured."
            exit 0
          fi
          npm install -g firebase-tools
          AUTH_ARGS=()
          if [[ -n "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]]; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          else
            AUTH_ARGS=(--token "$FIREBASE_TOKEN")
          fi
          RECIPIENT_ARGS=()
          if [[ -n "${FIREBASE_TESTERS:-}" ]]; then
            RECIPIENT_ARGS+=(--testers "$FIREBASE_TESTERS")
          fi
          if [[ -n "${FIREBASE_TESTER_GROUPS:-}" ]]; then
            RECIPIENT_ARGS+=(--groups "$FIREBASE_TESTER_GROUPS")
          fi
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-release.apk \
            --app "1:149108991969:android:b09d15308f8f5d9266d4a0" \
            --release-notes "WorldVoice beta: Stories publish reliability, room/live notifications and latest gifts" \
            "${RECIPIENT_ARGS[@]}" "${AUTH_ARGS[@]}" \
            | tee firebase-stories-beta-result.txt

      - name: Upload distribution summary if present
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WorldVoice-Beta-Firebase-Distribution-Result
          path: firebase-stories-beta-result.txt
          if-no-files-found: ignore
          retention-days: 14
