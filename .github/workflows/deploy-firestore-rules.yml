name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - lib/**
      - test/**
      - pubspec.yaml
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firestore-rules.yml
      - backend/scripts/deploy_firestore_rules_admin.mjs
      - backend/scripts/configure_chat_delivery_ttl.mjs

permissions:
  contents: read

jobs:
  verify-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/chat_delivery_crypto_test.dart
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
        working-directory: test/firestore
      - run: npx firebase emulators:exec --config ../../firebase.rules-test.json --only firestore --project demo-worldvoice-rules "npm test"
        working-directory: test/firestore

  deploy-rules:
    needs: verify-delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        id: auth
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Firebase credentials missing::FIREBASE_SERVICE_ACCOUNT_JSON must be configured for worldvoice-37896. No production rules were published."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          # Read only the public identity metadata. Never print any credential or key.
          node -e '
            const fs = require("node:fs");
            const account = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/firebase-service-account.json", "utf8"));
            if (account.type !== "service_account" || account.project_id !== "worldvoice-37896" || !account.client_email) {
              console.error("::error title=Wrong Firebase project::The configured service account must belong to worldvoice-37896.");
              process.exit(1);
            }
            console.log("Service account to grant Firebase IAM roles:", account.client_email);
            console.log("Required: roles/firebaserules.admin, roles/serviceusage.serviceUsageViewer, roles/datastore.indexAdmin (for encrypted-message TTL).");
          '
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Firestore security rules only
        id: cli_deploy
        if: steps.auth.outputs.configured == 'true'
        continue-on-error: true
        run: firebase deploy --only firestore:rules --project worldvoice-37896 --non-interactive

      - name: Use official Firebase Admin SDK when CLI cannot inspect Service Usage
        if: steps.auth.outputs.configured == 'true' && steps.cli_deploy.outcome == 'failure'
        working-directory: backend
        run: |
          # The backend has no committed package-lock.json; npm ci would fail.
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/deploy_firestore_rules_admin.mjs

      - name: Configure expiry for temporary encrypted chat deliveries
        if: steps.auth.outputs.configured == 'true'
        working-directory: backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/configure_chat_delivery_ttl.mjs
