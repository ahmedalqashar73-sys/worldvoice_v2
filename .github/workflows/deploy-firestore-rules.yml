name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches:
      - fix/finish-room-hub-quiz-gift-20260928
      - feat/chat-social-foundation-20261004
      - feature/scalable-progress-foundation
    paths:
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firestore-rules.yml
      - backend/scripts/deploy_firestore_rules_admin.mjs
      - backend/scripts/deploy_firestore_rules_admin.mjs

permissions:
  contents: read

jobs:
  verify-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/chat_delivery_crypto_test.dart
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --no-audit --no-fund
        working-directory: test/firestore
      - run: npx firebase emulators:exec --config ../../firebase.rules-test.json --only firestore --project demo-worldvoice-rules "npm test"
        working-directory: test/firestore

  deploy-rules:
    needs: verify-delivery
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        id: auth
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured; skipping production deploy."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Firestore rules and indexes with Firebase CLI
        id: cli_deploy
        continue-on-error: true
        if: steps.auth.outputs.configured == 'true'
        run: firebase deploy --only firestore:rules --project worldvoice-37896 --non-interactive

      - name: Use official Firebase Admin SDK when CLI cannot inspect Service Usage
        if: steps.auth.outputs.configured == 'true' && steps.cli_deploy.outcome == 'failure'
        working-directory: backend
        run: |
          # The backend has no committed package-lock.json; npm ci would fail.
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/deploy_firestore_rules_admin.mjs

      - name: Configure expiry for temporary encrypted chat deliveries
        if: steps.auth.outputs.configured == 'true'
        working-directory: backend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/configure_chat_delivery_ttl.mjs
