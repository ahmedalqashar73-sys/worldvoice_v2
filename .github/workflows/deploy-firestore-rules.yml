name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches:
      - fix/finish-room-hub-quiz-gift-20260928
      - feat/chat-social-foundation-20261004
    paths:
      - firestore.rules
      - firestore.indexes.json
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firestore-rules.yml

permissions:
  contents: read

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Firebase
        id: auth
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT_JSON is not configured; skipping production deploy."
            exit 0
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy Firestore rules and indexes
        id: firebase_deploy
        if: steps.auth.outputs.configured == 'true'
        continue-on-error: true
        run: firebase deploy --only firestore:rules,firestore:indexes --project worldvoice-37896 --non-interactive

      - name: Deploy rules directly when Firebase CLI cannot inspect Service Usage
        if: steps.auth.outputs.configured == 'true' && steps.firebase_deploy.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail

          # The deploy service account can be intentionally restricted.
          # Firebase CLI checks serviceusage.services.get before publishing;
          # this narrow fallback uses the Firebase Rules API directly.
          gcloud auth activate-service-account \
            --key-file="$GOOGLE_APPLICATION_CREDENTIALS" >/dev/null
          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          jq -Rs '{
            source: {
              files: [
                {
                  name: "firestore.rules",
                  content: .
                }
              ]
            }
          }' firestore.rules > "$RUNNER_TEMP/ruleset.json"

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/ruleset.json" \
            "https://firebaserules.googleapis.com/v1/projects/worldvoice-37896/rulesets" \
            > "$RUNNER_TEMP/ruleset-response.json"

          RULESET_NAME="$(jq -r '.name // empty' "$RUNNER_TEMP/ruleset-response.json")"
          if [ -z "$RULESET_NAME" ]; then
            cat "$RUNNER_TEMP/ruleset-response.json"
            echo "Firebase Rules API did not return a ruleset name."
            exit 1
          fi

          jq -n \
            --arg name "projects/worldvoice-37896/releases/cloud.firestore" \
            --arg rulesetName "$RULESET_NAME" \
            '{name: $name, rulesetName: $rulesetName}' \
            > "$RUNNER_TEMP/release.json"

          curl --fail-with-body --silent --show-error \
            -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @"$RUNNER_TEMP/release.json" \
            "https://firebaserules.googleapis.com/v1/projects/worldvoice-37896/releases/cloud.firestore?updateMask=rulesetName" \
            > "$RUNNER_TEMP/release-response.json"

          jq -e --arg expected "$RULESET_NAME" \
            '.rulesetName == $expected' \
            "$RUNNER_TEMP/release-response.json" >/dev/null
          echo "Published Firestore ruleset: $RULESET_NAME"