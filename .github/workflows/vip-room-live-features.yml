name: VIP rooms, Live and captions entitlements
on:
  pull_request:
    branches:
      - feature/scalable-progress-foundation
    paths:
      - 'lib/features/rooms/services/vip_room_features.dart'
      - 'lib/features/rooms/services/room_quota_service.dart'
      - 'lib/features/rooms/presentation/agora_voice_room_screen.dart'
      - 'lib/features/live/presentation/live_screen.dart'
      - 'lib/features/profile/presentation/vip_membership_screen.dart'
      - 'backend/src/vip_feature_policy.js'
      - 'backend/src/server.js'
      - 'backend/test/vip_feature_policy.test.js'
      - 'test/vip_room_features_test.dart'
      - '.github/workflows/vip-room-live-features.yml'
jobs:
  flutter_vip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze VIP entitlement integration
        run: flutter analyze --no-pub lib/features/rooms/services/vip_room_features.dart lib/features/rooms/services/room_quota_service.dart lib/features/rooms/presentation/agora_voice_room_screen.dart lib/features/live/presentation/live_screen.dart lib/features/profile/presentation/vip_membership_screen.dart test/vip_room_features_test.dart
      - name: Test VIP time, expiry, and existing memberships
        run: flutter test --no-pub test/vip_room_features_test.dart test/vip_membership_store_test.dart
  server_vip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check backend JavaScript syntax
        run: node --check backend/src/server.js
      - name: Test server-enforced VIP Teacher AI
        run: node --test backend/test/vip_feature_policy.test.js
