name: Complete VOA Level 2 bilingual scripts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_voa_a2_complete.py'
      - '.github/workflows/complete_voa_a2_bilingual.yml'
  workflow_dispatch:

permissions:
  contents: write

# Do not race two editors writing VOA episode JSON files on main.
concurrency:
  group: worldvoice-voa-a2-transcripts-main
  cancel-in-progress: false

jobs:
  build-original-dialogues:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official transcript reader and offline Arabic translator
        run: |
          python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5' 'argostranslate>=1.9,<2'
      - name: Refresh only original main before extracting source transcripts
        run: git pull --ff-only origin main
      - name: Import all remaining complete VOA original English dialogues
        env:
          ARGOS_DEVICE_TYPE: cpu
        run: python scripts/build_voa_a2_complete.py
      - name: Keep machine-translated Arabic clearly marked as pending review
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('assets/podcasts/voa_english_a2_originals.json').read_text())
          assert len(data['lessons']) == 30
          complete=sum(x['transcript_scope']=='full' for x in data['lessons'])
          partial=sum(x['transcript_scope']=='excerpt' for x in data['lessons'])
          assert complete+partial==30
          print(f"Full bilingual scripts: {complete}/30; excerpts needing review: {partial}/30")
          for item in data['lessons']:
              ep=json.loads(Path('assets/podcasts/en/A2/'+item['id']+'.json').read_text())
              assert ep['source_url']==item['source_url']
              assert ep['audio_url']==item['audio_url']
              assert ep['dialogue'] and all(x['text'] and x['translation_ar'] for x in ep['dialogue'])
              assert ep.get('sync_status')=='unverified'
          PY
      - name: Commit verified source-based scripts directly to original main
        run: |
          if git diff --quiet -- assets/podcasts/voa_english_a2_originals.json assets/podcasts/en/A2; then
            echo 'No dialogue updates required.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/podcasts/voa_english_a2_originals.json assets/podcasts/en/A2
          git commit -m "content(podcast): complete VOA A2 English transcripts with marked Arabic draft translations"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Attach transcript extraction review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voa-a2-complete-dialogue-review
          path: /tmp/voa_a2_full_import_report.json
          if-no-files-found: ignore
