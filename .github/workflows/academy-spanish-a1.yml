name: Spanish A1 complete course checks
on:
  pull_request:
    branches: [feature/scalable-progress-foundation]
    paths:
      - 'lib/features/learn/data/academy_spanish_a1_course.dart'
      - 'lib/features/learn/presentation/academy_spanish_a1_screen.dart'
      - 'lib/features/learn/presentation/academy_course_screen.dart'
      - 'test/academy_spanish_a1_full_course_test.dart'
      - '.github/workflows/academy-spanish-a1.yml'
jobs:
  verify_spanish_a1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze Spanish Academy A1
        run: |
          flutter analyze --no-pub lib/features/learn/data/academy_spanish_a1_course.dart lib/features/learn/presentation/academy_spanish_a1_screen.dart lib/features/learn/presentation/academy_course_screen.dart test/academy_spanish_a1_full_course_test.dart
      - name: Verify Spanish 30 lessons and UI
        run: flutter test --no-pub test/academy_spanish_a1_full_course_test.dart
