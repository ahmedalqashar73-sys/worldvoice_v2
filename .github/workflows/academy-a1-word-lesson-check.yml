name: Academy A1 40-word integration checks
on:
  pull_request:
    branches:
      - feature/scalable-progress-foundation
    paths:
      - 'lib/features/learn/**'
      - 'test/academy*'
      - '.github/workflows/academy-a1-word-lesson-check.yml'
jobs:
  verify_a1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        run: flutter pub get
      - name: Analyze changed A1 sources
        run: |
          flutter analyze --no-pub lib/features/learn/data/academy_english_a1_vocabulary.dart lib/features/learn/data/academy_english_a1_learning_loop.dart lib/features/learn/presentation/academy_english_a1_integrated_lesson.dart test/academy_english_a1_full_path_test.dart
      - name: Run A1 curriculum tests
        run: flutter test --no-pub test/academy_english_a1_full_path_test.dart test/academy_a1_dialogues_test.dart
