name: Temporary Academy Content Batch Validation
on:
  push:
    branches:
      - feat/academy-a2-c2-five-original-full-lessons-20261020
jobs:
  academy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/academy_english_advanced_story_tests.dart test/academy_grammar_workshops_test.dart test/academy_english_a1_full_path_test.dart
