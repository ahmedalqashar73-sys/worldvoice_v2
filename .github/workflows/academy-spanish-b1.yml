name: Spanish B1 integrated course checks
on:
  pull_request:
    branches:
      - feat/academy-spanish-a2-30-integrated-lessons-20261021
      - feature/scalable-progress-foundation
    paths:
      - 'lib/features/learn/data/academy_spanish_b1_course.dart'
      - 'lib/features/learn/presentation/academy_spanish_a1_screen.dart'
      - 'lib/features/learn/presentation/academy_course_screen.dart'
      - 'test/academy_spanish_b1_full_course_test.dart'
      - '.github/workflows/academy-spanish-b1.yml'
jobs:
  verify_spanish_b1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Analyze Spanish A1 A2 B1
        run: |
          flutter analyze --no-pub lib/features/learn/data/academy_spanish_a1_course.dart lib/features/learn/data/academy_spanish_a2_course.dart lib/features/learn/data/academy_spanish_b1_course.dart lib/features/learn/presentation/academy_spanish_a1_screen.dart lib/features/learn/presentation/academy_course_screen.dart test/academy_spanish_b1_full_course_test.dart
      - name: Verify all Spanish A1 A2 B1 curriculum tests
        run: flutter test --no-pub test/academy_spanish_a1_full_course_test.dart test/academy_spanish_a2_full_course_test.dart test/academy_spanish_b1_full_course_test.dart
