name: Validate WorldVoice

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/finish-room-hub-quiz-gift-20260928, feat/chat-social-foundation-20261004]
  workflow_dispatch:

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Verify eight background assets before publishing
        run: python3 scripts/verify_room_background_assets.py
      - run: python3 scripts/verify_castle_assets.py --require-webp
      - run: flutter analyze
      - run: flutter test test/room_background_catalog_test.dart test/worldvoice_avatar_frame_test.dart test/create_room_page_test.dart test/room_conversation_panel_test.dart test/room_board_text_test.dart test/board_media_url_test.dart test/classic_gift_catalog_test.dart test/classic_gift_visual_test.dart test/luxury_gift_assets_test.dart test/coin_pack_presentation_test.dart test/classic_gift_mesh_test.dart test/friend_gift_preview_test.dart test/room_castle_progression_test.dart test/reward_journey_test.dart

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/room_task_policy.js
      - run: node --check src/chat_routes.js
      - run: node --check src/story_routes.js
      - run: node --check src/social_routes.js
      - run: node --check src/call_routes.js
      - run: node --check scripts/seed-classic-gifts.mjs
      - run: node --check scripts/grant-beta-access.mjs
      - run: npm test

      - name: Diagnose published API and Agora worker (public checks only)
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          const checks = [
            ['Social + AI', 'https://worldvoice-teacher-ai.onrender.com/health'],
            ['Economy + accounts', 'https://worldvoice-v2.onrender.com/health'],
            ['Agora Worker', 'https://worldvoice-agora-token.worldvoice.workers.dev/health'],
          ];
          await Promise.all(checks.map(async ([label, url]) => {
            try {
              const response = await fetch(url, {signal: AbortSignal.timeout(65000)});
              const body = (await response.text()).slice(0, 400);
              console.log(JSON.stringify({label, status: response.status, body}));
              if (!response.ok) process.exitCode = 1;
            } catch (error) {
              console.error(JSON.stringify({label, error: error?.message || String(error)}));
              process.exitCode = 1;
            }
          }));
          JS

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
        working-directory: test/firestore
      - run: npm install --no-audit --no-fund
        working-directory: backend
      - name: Test Firestore room access in isolated emulator
        working-directory: test/firestore
        run: npx firebase emulators:exec --config ../../firebase.rules-test.json --only firestore --project demo-worldvoice-rules "npm test && cd ../../backend && node --test test/room_task_routes.test.js test/engagement_routes.test.js"

  castle-test-apk:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/scalable-progress-foundation'
    needs: [flutter-analyze, backend-check, firestore-rules]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: python3 scripts/verify_castle_assets.py --require-webp
      - run: sed -i 's/-Xmx2048m/-Xmx4096m/' android/gradle.properties
      - name: Build test artifact only (no deployment or distribution)
        run: >
          flutter build apk --debug
          --dart-define=AGORA_APP_ID=fa41476c6813471eb45c059bcb4a0e19
          --dart-define=WORLDVOICE_ROOM_BACKEND_URL=https://worldvoice-v2.onrender.com
          --dart-define=AGORA_TOKEN_ENDPOINT=https://worldvoice-agora-token.worldvoice.workers.dev/agora/token
          --dart-define=WORLDVOICE_ECONOMY_ENDPOINT=https://worldvoice-v2.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: WorldVoice-castles-development-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
