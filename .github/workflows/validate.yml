name: Validate WorldVoice

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/finish-room-hub-quiz-gift-20260928, feat/chat-social-foundation-20261004]
  workflow_dispatch:

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Verify eight background assets before publishing
        run: python3 scripts/verify_room_background_assets.py
      - run: flutter analyze
      - run: flutter test test/room_background_catalog_test.dart test/worldvoice_avatar_frame_test.dart test/create_room_page_test.dart test/room_conversation_panel_test.dart test/room_board_text_test.dart test/board_media_url_test.dart test/classic_gift_catalog_test.dart test/classic_gift_visual_test.dart test/luxury_gift_assets_test.dart test/coin_pack_presentation_test.dart test/classic_gift_mesh_test.dart test/friend_gift_preview_test.dart test/room_castle_progression_test.dart

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/room_task_policy.js
      - run: node --check src/chat_routes.js
      - run: node --check src/story_routes.js
      - run: node --check src/social_routes.js
      - run: node --check src/call_routes.js
      - run: node --check scripts/seed-classic-gifts.mjs
      - run: node --check scripts/grant-beta-access.mjs
      - run: node --test test/classic_gifts.test.js test/admin_cosmetic_access.test.js test/economy_policy.test.js test/room_task_policy.test.js

      - name: Diagnose published API and Agora worker (public checks only)
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          const checks = [
            ['Social + AI', 'https://worldvoice-teacher-ai.onrender.com/health'],
            ['Economy + accounts', 'https://worldvoice-v2.onrender.com/health'],
            ['Agora Worker', 'https://worldvoice-agora-token.worldvoice.workers.dev/health'],
          ];
          await Promise.all(checks.map(async ([label, url]) => {
            try {
              const response = await fetch(url, {signal: AbortSignal.timeout(65000)});
              const body = (await response.text()).slice(0, 400);
              console.log(JSON.stringify({label, status: response.status, body}));
              if (!response.ok) process.exitCode = 1;
            } catch (error) {
              console.error(JSON.stringify({label, error: error?.message || String(error)}));
              process.exitCode = 1;
            }
          }));
          JS

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
        working-directory: test/firestore
      - name: Test Firestore room access in isolated emulator
        working-directory: test/firestore
        run: npx firebase emulators:exec --config ../../firebase.rules-test.json --only firestore --project demo-worldvoice-rules "npm test"