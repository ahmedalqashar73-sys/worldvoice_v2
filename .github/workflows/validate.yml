name: Validate WorldVoice

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - name: Verify eight background assets before publishing
        run: python3 scripts/verify_room_background_assets.py
      - run: python3 scripts/verify_castle_assets.py --require-webp
      - run: flutter analyze
      - name: Verify WorldBond friend URLs, quizzes and private chat paths
        run: flutter test test/world_bond_api_url_test.dart
      - name: Verify Live Agora token bootstrap and host identity
        run: flutter test test/live_host_token_bootstrap_test.dart
      - name: Verify premium Live host-first camera layout
        run: flutter test test/live_video_order_test.dart test/live_camera_controls_test.dart test/live_camera_off_tile_test.dart test/agora_connection_deadline_test.dart test/live_audience_languages_test.dart
      - name: Verify private Story replies and encrypted delivery
        run: flutter test test/story_reply_sheet_test.dart test/chat_delivery_crypto_test.dart test/live_camera_controls_test.dart test/worldvoice_story_regression_test.dart test/worldvoice_chat_shared_links_test.dart
      - run: flutter test
      - run: dart test/story_filter_presets_check.dart

  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package.json
      - run: npm install
      - run: node --check src/server.js
      - run: node --check src/room_task_policy.js
      - run: node --check src/chat_routes.js
      - run: node --check src/story_routes.js
      - run: node --check src/social_routes.js
      - run: node --check src/call_routes.js
      - run: node --check scripts/seed-classic-gifts.mjs
      - run: node --check scripts/grant-beta-access.mjs
      - run: npm test

      - name: Diagnose published API and Agora worker (public checks only)
        continue-on-error: true
        run: |
          node --input-type=module <<'JS'
          const checks = [
            ['Social + AI', 'https://worldvoice-teacher-ai.onrender.com/health'],
            ['Economy + accounts', 'https://worldvoice-v2.onrender.com/health'],
            ['Agora Worker', 'https://worldvoice-agora-token.worldvoice.workers.dev/health'],
          ];
          await Promise.all(checks.map(async ([label, url]) => {
            try {
              const response = await fetch(url, {signal: AbortSignal.timeout(65000)});
              const body = (await response.text()).slice(0, 400);
              console.log(JSON.stringify({label, status: response.status, body}));
              if (!response.ok) process.exitCode = 1;
              if (label === 'Agora Worker' && response.ok) {
                // The old Worker can pass /health and reject anonymous
                // token requests, yet still reject every new Live.
                const health = JSON.parse(body);
                if (health.tokenApiRevision !== '2026-10-23.6' ||
                    health.liveHostBootstrapSupported !== true) {
                  console.error(
                    '::warning title=Live token Worker deployment missing::' +
                    'The live-aware Agora Worker revision is not deployed. ' +
                    'Configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID ' +
                    'as GitHub Actions secrets, then rerun Agora Worker Unit Tests.'
                  );
                  process.exitCode = 1;
                }
              }
            } catch (error) {
              console.error(JSON.stringify({label, error: error?.message || String(error)}));
              process.exitCode = 1;
            }
          }));
          // A GET /health can succeed while Agora signing credentials are
          // missing. An anonymous POST must yield 401, never 503 or 404.
          try {
            const response = await fetch(
              'https://worldvoice-agora-token.worldvoice.workers.dev/agora/token',
              {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({channelName: 'live_healthcheck', role: 'publisher'}),
                signal: AbortSignal.timeout(12000),
              },
            );
            console.log(JSON.stringify({
              label: 'Agora Worker signer preflight (no auth)',
              status: response.status,
              ready: response.status === 401,
            }));
            if (response.status !== 401) process.exitCode = 1;
          } catch (error) {
            console.error(JSON.stringify({
              label: 'Agora Worker signer preflight',
              error: error?.message || String(error),
            }));
            process.exitCode = 1;
          }
          JS

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install --no-audit --no-fund
        working-directory: test/firestore
      - run: npm install --no-audit --no-fund
        working-directory: backend
      - name: Test Firestore room access in isolated emulator
        working-directory: test/firestore
        run: npx firebase emulators:exec --config ../../firebase.rules-test.json --only firestore --project demo-worldvoice-rules "npm test && cd ../../backend && npm test"
