name: Validate Academy Podcasts

on:
  push:
    branches: [main]
    paths:
      - 'lib/features/learn/data/academy_podcast_repository.dart'
      - 'lib/features/learn/presentation/podcast_library_section.dart'
      - 'lib/features/learn/presentation/podcast_sentence_translation.dart'
      - 'lib/features/learn/presentation/voa_originals_section.dart'
      - 'lib/features/learn/presentation/a2_long_listening_section.dart'
      - 'lib/features/learn/presentation/b1_voa_long_form_section.dart'
      - 'lib/features/learn/presentation/b1_voa_transcript_section.dart'
      - 'lib/features/learn/presentation/nasa_advanced_podcast_section.dart'
      - 'scripts/voa_b1_transcript_candidate.py'
      - 'scripts/tests/test_voa_b1_transcript_candidate.py'
      - 'scripts/tests/test_b1_original_long_caption_assets.py'
      - 'scripts/tests/test_nasa_advanced_actual_translations.py'
      - 'lib/features/learn/presentation/learn_screen.dart'
      - 'assets/podcasts/**'
      - 'test/academy_podcast_*.dart'
      - 'test/academy_voa_originals_test.dart'
      - 'test/academy_a2_long_listening_test.dart'
      - 'test/academy_b1_voa_long_form_test.dart'
      - 'test/academy_b1_transcript_test.dart'
      - 'test/academy_nasa_advanced_test.dart'
      - 'test/academy_podcast_on_demand_translation_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/academy-podcast-validation.yml'
  workflow_dispatch:

jobs:
  validate-podcasts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Guard B1 original-source audio and review-only captions
        run: |
          python -m py_compile scripts/voa_b1_transcript_candidate.py
          python -m unittest discover -s scripts/tests -p 'test_voa_b1_transcript_candidate.py'
      - name: Validate all 30 original full-length B1 English-Arabic drafts
        run: python -m unittest discover -s scripts/tests -p 'test_b1_original_long_caption_assets.py'
      - name: Verify actual NASA B2 C1 C2 source-linked translation assets
        run: python -m unittest discover -s scripts/tests -p 'test_nasa_advanced_actual_translations.py'
      - name: Analyze podcast modules
        run: flutter analyze
      - name: Verify eight languages, dialogue transcript, reader and controls
        run: flutter test test/academy_podcast_repository_test.dart test/academy_podcast_reader_test.dart test/academy_voa_originals_test.dart test/academy_a2_long_listening_test.dart test/academy_b1_voa_long_form_test.dart test/academy_b1_transcript_test.dart test/academy_nasa_advanced_test.dart test/academy_podcast_on_demand_translation_test.dart
