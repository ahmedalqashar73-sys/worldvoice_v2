name: Validate Academy Podcasts

on:
  push:
    branches: [main]
    paths:
      - 'lib/features/learn/data/academy_podcast_repository.dart'
      - 'lib/features/learn/presentation/podcast_library_section.dart'
      - 'lib/features/learn/presentation/voa_originals_section.dart'
      - 'lib/features/learn/presentation/a2_long_listening_section.dart'
      - 'lib/features/learn/presentation/b1_voa_long_form_section.dart'
      - 'scripts/voa_b1_transcript_candidate.py'
      - 'scripts/tests/test_voa_b1_transcript_candidate.py'
      - 'lib/features/learn/presentation/learn_screen.dart'
      - 'assets/podcasts/**'
      - 'test/academy_podcast_*.dart'
      - 'test/academy_voa_originals_test.dart'
      - 'test/academy_a2_long_listening_test.dart'
      - 'test/academy_b1_voa_long_form_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/academy-podcast-validation.yml'
  workflow_dispatch:

jobs:
  validate-podcasts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Guard B1 original-source audio and review-only captions
        run: |
          python -m py_compile scripts/voa_b1_transcript_candidate.py
          python -m unittest discover -s scripts/tests -p 'test_voa_b1_transcript_candidate.py'
      - name: Analyze podcast modules
        run: flutter analyze
      - name: Verify eight languages, dialogue transcript, reader and controls
        run: flutter test test/academy_podcast_repository_test.dart test/academy_podcast_reader_test.dart test/academy_voa_originals_test.dart test/academy_a2_long_listening_test.dart test/academy_b1_voa_long_form_test.dart
