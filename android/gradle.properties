# Keep Gradle memory conservative so Windows does not kill the JVM daemon.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -Dfile.encoding=UTF-8

# Stability first on lower-memory development machines.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true

# Flutter template compatibility flags.
android.newDsl=false
android.builtInKotlin=false
